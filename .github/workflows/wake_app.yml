name: Wake Up Attendance App

on:
  schedule:
    - cron: '45 22 * * 0-5'
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Streamlit Apps
        run: |
          # App Event
          curl -s -L "https://ump-smartattend.streamlit.app/" \
            -H "User-Agent: Mozilla/5.0" -o /dev/null -w "App Điểm danh: %{http_code}\n"
          
          # App Điểm danh
          curl -s -L "https://ump-attendance.streamlit.app/" \
            -H "User-Agent: Mozilla/5.0" -o /dev/null -w "App 2: %{http_code}\n"

          # App Đổi font chữ
          curl -s -L "https://font-converter.streamlit.app/" \
            -H "User-Agent: Mozilla/5.0" -o /dev/null -w "App 3: %{http_code}\n"
            
